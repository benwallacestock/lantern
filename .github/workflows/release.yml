# Every push to main is a release. The tests run; then scripts/release.ts reads the commits since the last tag,
# decides the version from them (feat → minor, fix and other changes → patch, docs/chore/ci/test → no release),
# writes the notes into CHANGELOG.md, bumps the versions, commits "lantern x.y.z", tags and pushes; then the GitHub
# Release is published with those notes and the package goes to npm by trusted publishing, with provenance. The
# release commit is pushed with the workflow's own token, so it does not start another run.
name: Release
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags: the release script needs the last one
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: npm test
      - name: Version and notes from the commits; commit, tag, push
        id: cut
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.ts auto
      - name: GitHub Release
        if: steps.cut.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.cut.outputs.version }}
        run: |
          PRE=""; case "$V" in 0.*) PRE="--prerelease";; esac
          gh release create "v$V" --title "lantern $V" --notes-file notes.md $PRE
      # To npm by trusted publishing: the package on npmjs.com names this repository and workflow as its publisher,
      # so no token is needed and the package carries provenance. (An NPM_TOKEN secret would be used instead if set.)
      - name: Publish to npm
        if: steps.cut.outputs.version != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          V: ${{ steps.cut.outputs.version }}
        run: |
          if npm view "@benwallacestock/lantern@$V" version >/dev/null 2>&1; then echo "@benwallacestock/lantern@$V is already on npm: nothing to do"; exit 0; fi
          npm publish --provenance --access public
