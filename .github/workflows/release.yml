name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag matches package.json
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but package.json says $V"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: node scripts/release.ts notes "${GITHUB_REF_NAME#v}" > notes.md && cat notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          PRE=""; case "$V" in 0.*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "lantern $V" --notes-file notes.md $PRE
      # To npm. With an NPM_TOKEN secret (an npm granular access token that may publish lantern-browser) it publishes
      # with that; without one it tries npm's trusted publishing, which works once the package on npmjs.com names
      # this repository and workflow as its publisher. Either way the package carries provenance.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "lantern-browser@$V" version >/dev/null 2>&1; then echo "lantern-browser@$V is already on npm (published by hand?): nothing to do"; exit 0; fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "no NPM_TOKEN secret: trying trusted publishing"; fi
          npm publish --provenance --access public
