# Every push to main is a release. The tests run; then scripts/release.ts reads the commits since the last tag,
# decides the version from them (feat → minor, fix and other changes → patch, docs/chore/ci/test → no release),
# writes the notes into CHANGELOG.md, bumps the versions, commits "lantern x.y.z", tags and pushes; then the GitHub
# Release is published with those notes and the package goes to npm by trusted publishing, with provenance. The
# release commit is pushed with the workflow's own token, so it does not start another run. A run with nothing new
# to cut still publishes the Release or the npm package an earlier run left behind (GitHub has its outages).
name: Release
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags: the release script needs the last one
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      # Installing from apt can hang on the runner (a stuck mirror, a lock held by its own updater): a release run sat
      # on this step for half an hour once. Five minutes is plenty when it works; otherwise fail and re-run.
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg > /dev/null
        timeout-minutes: 5
      - run: npm test
      - name: Version and notes from the commits; commit, tag, push
        id: cut
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.ts auto
      - name: GitHub Release
        if: steps.cut.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.cut.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then echo "release v$V exists"; exit 0; fi
          PRE=""; case "$V" in 0.*) PRE="--prerelease";; esac
          for wait in 30 60 120 180 240 300 0; do
            gh release create "v$V" --title "lantern $V" --notes-file notes.md $PRE && exit 0
            [ "$wait" = 0 ] && exit 1; echo "GitHub refused the release; trying again in ${wait}s"; sleep "$wait"
          done
      # To npm by trusted publishing: the package on npmjs.com names this repository and workflow as its publisher,
      # so no token is needed and the package carries provenance. (An NPM_TOKEN secret would be used instead if set.)
      - name: Publish to npm
        if: steps.cut.outputs.version != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          V: ${{ steps.cut.outputs.version }}
        run: |
          if npm view "@benwallacestock/lantern@$V" version >/dev/null 2>&1; then echo "@benwallacestock/lantern@$V is already on npm: nothing to do"; exit 0; fi
          npm publish --provenance --access public
