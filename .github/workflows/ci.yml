name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The runner has Google Chrome; ffmpeg is installed so both assembly paths are tested (the suite covers the
      # no-ffmpeg path itself by pointing LANTERN_FFMPEG nowhere).
      # Installing from apt can hang on the runner (a stuck mirror, a lock held by its own updater): a release run sat
      # on this step for half an hour once. Five minutes is plenty when it works; otherwise fail and re-run.
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg > /dev/null
        timeout-minutes: 5
      - run: google-chrome --version && ffmpeg -version > /dev/null && ffprobe -version > /dev/null
      - run: npm test
      # The way people get it: the packed tarball, installed into a prefix, run as the one bundled file.
      - run: npm run build && npm pack && mkdir -p /tmp/lantern-prefix && LANTERN_SKILLS=off npm install -g --prefix /tmp/lantern-prefix ./benwallacestock-lantern-*.tgz && /tmp/lantern-prefix/bin/lantern version && /tmp/lantern-prefix/bin/lantern help | head -1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lantern-logs-node${{ matrix.node }}
          path: /tmp/lantern-home-*/log/
          if-no-files-found: ignore
